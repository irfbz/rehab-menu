<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REHAB MENU">
<title>リハビリメニュー作成</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* Layout: scoreboard-style dark workspace (library | plan); patient view = one dark column; print = white A4 sheet */
:root{
  --bg:#0B0D0C; --panel:#111412; --card:#141816; --field:#161A18;
  --line:#262B28; --line2:#2E3431;
  --fg:#F2F4F1; --fg2:#C9D0CB; --mute:#9AA39E; --mute2:#7E8782; --dim:#5D6661;
  --ac:#D7FF3A; --ac-tint:#181D12; --ac-deep:#12160D; --on-ac:#0B0D0C;
  --warn:#FF8A8A;
  --disp:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --jp:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--jp);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--disp);font-style:italic;font-weight:800;letter-spacing:.01em;line-height:.95}
.lbl{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* controls */
.btn{min-height:42px;padding:0 16px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--fg);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--mute2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:900}
.btn.strong{border-color:var(--fg);font-weight:700}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--warn);border-color:#4A2B2B}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:36px;height:36px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--ac);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.iconbtn.plain{color:var(--mute2);border-color:transparent}
.field{min-height:40px;background:var(--field);border:1px solid var(--line2);border-radius:6px;padding:0 10px;color:var(--fg);min-width:0}
.field:focus{border-color:var(--ac);outline:none}
textarea.field{padding:10px 12px;resize:vertical;width:100%;line-height:1.6}
input[type=date].field{padding:0 8px}
.chip{min-height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:transparent;color:var(--fg2);font-size:12px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:900}
.seg{display:flex;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:3px;gap:2px}
.seg button{min-height:32px;padding:0 14px;border:0;border-radius:5px;background:transparent;color:var(--mute);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--ac);color:var(--on-ac);font-weight:900}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tabs button{min-height:40px;padding:0;border:0;border-bottom:3px solid transparent;background:transparent;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--mute2)}
.tabs button.on{border-bottom-color:var(--ac);color:var(--fg);font-weight:800}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:0;outline:2px solid transparent;outline-offset:3px;padding:0}
.sw.on{outline-color:var(--fg)}
.flab{display:flex;flex-direction:column;gap:3px}
.flab>span{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--mute2);text-transform:uppercase}
.inline-lab{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--mute)}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);background:none;border:0;padding:0;text-align:left}
.brand .mark{width:32px;height:28px;background:var(--ac);transform:skewX(-14deg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand .mark span{transform:skewX(14deg);font-family:var(--disp);font-style:italic;font-weight:800;font-size:17px;color:var(--on-ac)}
.brand b{display:block;font-family:var(--disp);font-style:italic;font-weight:800;font-size:21px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-size:10px;color:var(--mute);letter-spacing:.1em;margin-top:2px}
.spacer{flex:1}
.back{background:none;border:0;color:var(--fg2);font-size:14px;min-height:44px;padding:0;display:flex;align-items:center;gap:4px}

/* home */
.home{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
.newgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.newcard{position:relative;text-align:left;padding:18px 18px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--fg);display:flex;flex-direction:column;gap:6px;min-height:132px;overflow:hidden}
.newcard:hover{border-color:var(--ac)}
.newcard .disp{font-size:34px}
.newcard .jp{font-weight:900;font-size:15px}
.newcard .desc{font-size:12px;color:var(--mute)}
.newcard .go{position:absolute;right:16px;top:16px;width:30px;height:30px;background:var(--ac);color:var(--on-ac);display:flex;align-items:center;justify-content:center;transform:skewX(-12deg);font-weight:900}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0;font-size:34px}
.sec-head h2 small{display:block;font-family:var(--jp);font-style:normal;font-weight:700;font-size:12px;color:var(--mute);letter-spacing:.1em;margin-bottom:4px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.prow .ini{font-family:var(--disp);font-style:italic;font-weight:800;font-size:28px;color:var(--ac);overflow:hidden;text-overflow:ellipsis}
.prow .meta{font-size:13px;color:var(--mute)}
.prow .ttl{font-weight:700}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:28px 18px;border:1px dashed var(--line2);border-radius:10px;color:var(--mute);text-align:center}
.menugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.menucard{text-align:left;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);display:flex;justify-content:space-between;align-items:center;gap:12px}
.menucard:hover{border-color:var(--mute2)}
.menucard b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.06em}
.menucard span{font-size:12px;color:var(--mute)}
.menucard .count{font-family:var(--disp);font-style:italic;font-weight:800;font-size:28px;color:var(--ac)}
.notice{padding:12px 14px;border:1px solid var(--line2);border-left:0;border-radius:8px;background:var(--panel);font-size:13px;color:var(--fg2);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}

/* editor */
.ed-fields{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;flex:1 1 560px}
.ed-fields .ini{width:72px;font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.04em}
.daysbadge{font-family:var(--disp);font-style:italic;font-weight:800;font-size:18px;color:var(--ac);white-space:nowrap}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.ed-body{display:flex;align-items:stretch}
.lib{flex:0 0 360px;background:var(--panel);border-right:1px solid var(--line);padding-block:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.lib-head{display:none}
.lib-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;padding-bottom:12px;margin-inline:-4px;padding-inline:4px}
.lib-chips{display:flex;flex-wrap:wrap;gap:6px}
.search{position:relative}
.search input{width:100%;padding-left:36px}
.search svg{position:absolute;left:12px;top:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);touch-action:pan-y}
.lrow .lt{width:52px;height:34px;border-radius:4px;background:#2A302D;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--dim)}
.lrow .lt img{width:100%;height:100%;object-fit:cover}
.lrow .lm{flex:1;min-width:0}
.lrow .lm b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lm span{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--mute)}
.lrow.tpl{padding:12px}
.lrow.tpl .lm b{font-size:14px}
.lrow.tpl .lm span{font-size:13px;letter-spacing:.06em}
.lrow .owner{font-size:11px;color:var(--mute2);font-family:var(--jp)}
.grip{color:var(--dim);cursor:grab;display:flex;align-items:center;padding:4px;flex-shrink:0;touch-action:none}
.plan{flex:1;min-width:0;padding-block:24px 120px;display:flex;flex-direction:column;gap:12px}
.plan>*{flex-shrink:0}
.plan-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.plan-head .jp{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.1em}
.plan-head h1{margin:0;font-size:44px}
.plan-head h1 em{color:var(--ac);font-style:inherit;margin-left:12px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-height:76px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.item .no{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;color:var(--ac);width:38px;line-height:1}
.item .th{width:96px;height:54px;border-radius:6px;background:#2A302D;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--dim)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .nm{font-size:16px;font-weight:900}
.item .pt{min-height:32px;font-size:13px;color:var(--fg2);background:transparent;border-color:transparent;padding:0 6px;margin-left:-6px}
.item .pt:hover{border-color:var(--line2)}
.item .flds{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.item .big{width:52px;text-align:center;font-family:var(--disp);font-weight:700;font-size:22px;background:var(--bg);padding:0 4px}
.item .unit{width:58px;background:var(--bg);font-size:13px;padding:0 4px}
.item .lt-sel{width:84px;background:var(--bg);font-size:13px;padding:0 4px}
.item .lv{width:84px;background:var(--bg);font-size:13px;font-weight:700}
.item .fq{width:96px;background:var(--bg);font-size:13px;padding:0 4px}
.step{display:flex;gap:4px;align-items:center}
.step button{width:30px;height:40px;border:1px solid var(--line2);border-radius:6px;background:transparent;font-size:16px;color:var(--fg2)}
.sidechk{display:flex;align-items:center;gap:6px;min-height:40px;font-size:13px;color:var(--fg2)}
.sidechk input{width:18px;height:18px;accent-color:var(--ac)}
.dropzone{border:2px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:4px;align-items:center}
.dropzone b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:18px;letter-spacing:.08em;color:var(--ac)}
.items .dropzone{list-style:none}
.ghost{opacity:.4;border-color:var(--ac)!important;border-style:dashed!important}
.items .lrow{border-color:var(--ac)}
.notebox{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.foot-info{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.mbar{display:none}

/* weekly */
.btabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btab{display:flex;align-items:stretch;min-height:44px;padding:0;border:1px solid var(--line2);border-radius:8px;background:var(--card);overflow:hidden;color:var(--fg)}
.btab .bl{width:36px;display:flex;align-items:center;justify-content:center;background:var(--bc);color:#0B0D0C;font-family:var(--disp);font-style:italic;font-weight:800;font-size:22px}
.btab .bn{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:700}
.btab .bn small{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--mute)}
.btab.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.bedit{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bedit input{width:200px}
.sched{margin-top:14px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sched-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.sched-head h2{margin:0;font-size:32px}
.days-wrap{overflow-x:auto;padding-bottom:4px}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.day.rest{background:repeating-linear-gradient(135deg,#111412 0 10px,#161A18 10px 20px)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:28px;line-height:1}
.day .dh span{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--mute)}
.bchip{min-height:36px;padding:0 8px;border:1px solid var(--line2);border-radius:6px;background:transparent;color:var(--mute);font-size:12px;text-align:left;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.bchip i{font-family:var(--disp);font-weight:800;font-size:15px;font-style:italic}
.bchip.on{background:var(--bc);border-color:var(--bc);color:#0B0D0C;font-weight:900}
.restlbl{margin-top:auto;text-align:center;font-family:var(--disp);font-style:italic;font-weight:800;letter-spacing:.1em;color:var(--fg2)}
.restlbl small{display:block;font-family:var(--jp);font-style:normal;font-weight:400;font-size:11px;color:var(--mute);letter-spacing:0}

/* pages: library / templates / settings */
.page{max-width:980px;margin:0 auto;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
.page h1{margin:0;font-size:42px}
.page h1 small{display:block;font-family:var(--jp);font-style:normal;font-weight:700;font-size:12px;color:var(--mute);letter-spacing:.1em;margin-bottom:4px}
.toolrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolrow .search{flex:1 1 240px}
.exrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.exrow .lt{width:84px;height:48px;border-radius:6px;background:#2A302D;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--dim)}
.exrow .lt img{width:100%;height:100%;object-fit:cover}
.exrow b{font-weight:900}
.exrow .meta{font-size:12px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line2);border-radius:3px;color:var(--fg2);margin-right:4px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.06em}
.card h2 small{font-family:var(--jp);font-weight:700;font-size:12px;color:var(--mute);margin-left:8px;letter-spacing:.06em}
.hdrrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.logo-box{width:64px;height:64px;border:1px dashed var(--dim);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--mute);background:#fff}
.logo-box img{width:100%;height:100%;object-fit:contain}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--ac)}
.help{font-size:12px;color:var(--mute);line-height:1.7}

/* preview */
.pv{max-width:1100px;margin:0 auto;padding-block:20px 64px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pv-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.sheet-wrap{background:#3A403C;border-radius:10px;padding:16px;overflow:hidden}
.sheet-wrap .sheet{box-shadow:0 10px 30px rgba(0,0,0,.4);margin:0 auto 16px;transform-origin:top left}
.sheet-wrap .sheet:last-child{margin-bottom:0}
.phone{width:min(390px,100%);height:760px;margin:0 auto;border:8px solid #1E2321;border-radius:36px;overflow:hidden;background:var(--bg)}
.phone-in{height:100%;overflow-y:auto}
.linkbox{display:flex;flex-direction:column;gap:10px}
.linkbox textarea{font-size:11px;font-family:ui-monospace,Menlo,monospace;height:72px;color:var(--fg2)}
.qrbig{background:#fff;border-radius:10px;padding:12px;display:flex;justify-content:center}
.qrbig svg{width:220px;height:220px}
.frame-note{padding:12px 14px;border:1px solid #4A3E1F;background:#1C1810;border-radius:8px;font-size:13px;color:#E8D9A8;line-height:1.7}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-family:var(--disp);font-style:italic;font-weight:800;font-size:28px}
.modal h3 small{display:block;font-family:var(--jp);font-style:normal;font-weight:700;font-size:12px;color:var(--mute);letter-spacing:.1em}
.modal .row{display:flex;flex-wrap:wrap;gap:10px}
.modal .row>*{flex:1 1 120px}
.modal .field{width:100%}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-acts .left{margin-right:auto}

function planDays(p) { if (!isDate(p.start) || !isDate(p.next)) return 7; return Math.max(1, Math.min(31, diffDays(p.start, p.next))); }

/* ================= pack / unpack (link payload) ================= */
function packItem(i) { return [i.name, i.reps, i.unit, i.sets, i.loadType, i.load, i.side ? 1 : 0, i.point, i.video, +i.start || 0, i.freq || '']; }
function unpackItem(a) { return { name: a[0] || '', reps: a[1] || '', unit: a[2] || '回', sets: a[3] || '', loadType: a[4] || '自重', load: a[5] || '', side: !!a[6], point: a[7] || '', video: a[8] || '', start: a[9] || 0, freq: a[10] || '' }; }
function pack(p) {
  const h = hdrById(p.headerId);
  const o = { v: 1, t: p.type, s: p.start, n: p.next, c: p.created, o: h ? h.org : '', a: S.settings.accent, m: p.note || '' };
  if (S.settings.webInitials && p.initials) o.i = p.initials;
  if (p.type === 'weekly') {
    normSched(p);
    const used = p.blocks.filter(b => b.items.length);
    o.b = used.map(b => [b.name, b.items.map(packItem), p.blocks.indexOf(b)]);
    o.d = p.sched.map(day => day.map(id => used.findIndex(b => b.id === id)).filter(x => x >= 0));
  } else o.x = p.items.map(packItem);
  return o;
}
function unpack(o) {
  const d = { type: o.t === 'weekly' ? 'weekly' : 'fixed', start: o.s, next: o.n, created: o.c, org: o.o || '', accent: ACCENTS[o.a] ? o.a : 'yellow', note: o.m || '', initials: o.i || '' };
  if (d.type === 'weekly') { d.blocks = (o.b || []).map(b => ({ name: b[0], items: (b[1] || []).map(unpackItem), ci: b[2] ?? 0 })); d.sched = o.d || []; }
  else d.items = (o.x || []).map(unpackItem);
  return d;
}
function b64u(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const bin = atob(str); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function encode(obj) {
  const json = JSON.stringify(obj);
  if (window.CompressionStream) {
    try { const st = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw')); const buf = await new Response(st).arrayBuffer(); return 'z' + b64u(new Uint8Array(buf)); } catch (e) { /* fall through */ }

}

  return JSON.parse(new TextDecoder().decode(bytes));
}

function qrSVG(text, ec = 'M') {
  if (!window.qrcode || !text) return '';
  try {
    const q = qrcode(0, ec); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QRコード"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#0B0D0C"/></svg>`;
  } catch (e) { return ''; }
}

/* ================= EDITOR ================= */

    const cats = Object.entries(TPL_GROUPS);
    const tpls = S.templates.filter(t => (U.libCat === 'all' || t.group === U.libCat) && (!q || t.name.toLowerCase().includes(q)));
    list = `<div class="lib-chips">${[['all', 'すべて'], ...cats].map(([k, l]) => `<button class="chip ${U.libCat === k ? 'on' : ''}" data-act="lib-cat" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="lib-list" id="libList">${tpls.map(t => `
        <div class="lrow tpl" data-tpl="${t.id}">
          <span class="grip">${IC.grip}</span>
          <div class="lm"><b>${esc(t.name)}</b><span>${t.items.length} EXERCISES ${t.owner ? `<span class="owner">· ${esc(t.owner)}</span>` : ''}</span></div>
          ${U.view === 'edit' ? `<button class="iconbtn plain" data-act="lib-tpl-edit" data-id="${t.id}" aria-label="${esc(t.name)}を編集">${IC.edit}</button>` : ''}<button class="iconbtn" data-act="add-tpl" data-id="${t.id}" aria-label="${esc(t.name)}をまとめて追加">+</button>

      <div class="lib-list" id="libList">${ex.map(e => { const th = thumbFor({ exId: e.id, video: e.video }); return `
        <div class="lrow" data-ex="${e.id}">
          <span class="grip">${IC.grip}</span>
          <div class="lt">${th ? `<img src="${esc(th)}" alt="" loading="lazy">` : 'PHOTO'}</div>

        </div>`; }).join('') || '<div class="empty">該当する種目がありません</div>'}</div>`;

    <label class="search"><span class="sr">検索</span><input class="field" id="lib-q" data-in="libQ" placeholder="${U.libTab === 'tpl' ? 'テンプレートを検索' : '種目・部位を検索'}" value="${esc(U.libQ)}">${IC.search}</label>

    <span class="grip drag" aria-label="ドラッグで並べ替え">${IC.grip}</span>
    <span class="no">${two(i + 1)}</span>
    <div class="th">${th ? `<img src="${esc(th)}" alt="">` : (it.video ? 'VIDEO' : 'PHOTO')}</div>
    <div class="info"><div class="nm">${esc(it.name)}</div><input class="field pt" data-f="point" value="${esc(it.point)}" placeholder="ポイント・注意点" aria-label="${esc(it.name)}のポイント"></div>
    <div class="flds">
      <label class="flab"><span>${repsKey(it.unit)}</span><span class="step"><button data-act="step" data-f="reps" data-d="-1" aria-label="減らす">−</button><input class="field big num" data-f="reps" value="${esc(it.reps)}" inputmode="decimal" aria-label="回数"><button data-act="step" data-f="reps" data-d="1" aria-label="増やす">+</button></span></label>

      ${mode === 'fixed' ? `<label class="flab"><span>FREQ</span><select class="field fq" data-f="freq" aria-label="頻度">${FREQS.map(f => `<option ${it.freq === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>` : ''}

}
function itemsHTML(items, mode) {

  return `<ul class="items" id="planList">${items.map((it, i) => itemRowHTML(it, i, mode)).join('')}${items.length ? '' : `<li class="dropzone"><b>DROP HERE</b><span>${isPhone ? '下の「＋ 追加」からテンプレートや種目を選んでください' : '左のテンプレート・種目をここへドラッグ、または＋で追加'}</span></li>`}</ul>`;
}

        <div class="days-wrap"><div class="days">${p.sched.map((day, di) => { const ds = addDays(p.start, di); const rest = day.length === 0; return `
          <div class="day ${rest ? 'rest' : ''}"><div class="dh"><b class="num">${parseD(ds).getDate()}</b><span>${DOW_EN[dow(ds)]}</span></div>
            ${p.blocks.map((bl, bi) => `<button class="bchip ${day.includes(bl.id) ? 'on' : ''}" style="--bc:${bColor(bi, S.settings.accent)}" data-act="toggle-day" data-d="${di}" data-b="${bl.id}" aria-pressed="${day.includes(bl.id)}"><i>${LETTERS[bi]}</i>${esc(bl.name)}</button>`).join('')}
            ${rest ? `<div class="restlbl">REST<small>休養日</small></div>` : ''}

}

  const long = ready && U.link.length > 2000;

    </div>
    <aside class="pv-side">
      ${IN_FRAME ? `<div class="frame-note">この画面はお試し表示です。印刷・PDF保存と、患者さんに送るリンクは、ツールを公開したページ（GitHub Pagesなど）で開くと使えます。</div>` : ''}

          <div class="qrbig">${qrSVG(U.link, long ? 'L' : 'M') || '<span style="color:#0B0D0C;font-size:12px;padding:20px">内容が多すぎてQRにできません。リンクで送ってください</span>'}</div>
          <p class="help" style="margin:0">患者さんのスマホでこのQRを読み取ると、その場で開けます。</p>
          <div class="toolrow"><button class="btn pri" data-act="copy-link">リンクをコピー</button><a class="btn" href="https://line.me/R/share?text=${encodeURIComponent('トレーニングメニューです\n' + U.link)}" target="_blank" rel="noopener">LINEで送る</a>${navigator.share && !IN_FRAME ? '<button class="btn" data-act="share-link">共有</button>' : ''}</div>
          <p class="help" style="margin:0">リンクの中にメニューが入っているので、サーバーには何も保存されません。${S.settings.webInitials ? 'イニシャルを含みます。' : '氏名・イニシャルは含みません。'}</p>`

/* ================= print sheet ================= */
function pImg(it) { const th = thumbFor(it); return `<div class="p-img">${th ? `<img src="${esc(th)}" alt="">` : 'PHOTO'}</div>`; }
function pQR(it, cls = '') { const l = videoLink(it); if (!l) return `<div class="p-noqr ${cls}">動画なし</div>`; return `<a class="p-qr" href="${esc(l)}">${qrSVG(l)}<span>▶ ${it.start ? fmtStart(it.start) + '〜' : 'WATCH'}</span></a>`; }
function pStats(it, compact) {
  return `<div class="p-stats">
    <div class="p-stat"><div class="k">${repsKey(it.unit)}${compact ? '' : ' ' + repsJp(it.unit)}</div><div class="v">${esc(it.reps || '-')}${it.unit !== '回' ? `<small>${esc(it.unit)}</small>` : ''}</div></div>
    <div class="p-stat"><div class="k">SETS${compact ? '' : ' セット'}</div><div class="v">${esc(it.sets || '-')}</div></div>
    <div class="p-stat"><div class="k">LOAD${compact ? '' : ' 負荷'}</div><div class="v jp">${esc(loadText(it))}</div></div>
  </div>`;
}
function pTags(it, fixed) { const t = []; if (fixed && it.freq) t.push(`<span class="p-tag ac">${esc(it.freq)}</span>`); if (it.side) t.push('<span class="p-tag">左右それぞれ</span>'); return t.length ? `<div class="p-tags">${t.join('')}</div>` : ''; }
function pRowLarge(it, i, fixed) {
  return `<div class="p-row"><div class="p-no">${two(i + 1)}</div>${pImg(it)}<div><div class="p-nm">${esc(it.name)}</div>${pStats(it)}${it.point ? `<div class="p-pt"><b>POINT</b>${esc(it.point)}</div>` : ''}${pTags(it, fixed)}</div>${pQR(it)}</div>`;
}
function pCard(it, i, fixed) {
  return `<div class="p-card"><div class="hd"><span class="p-no">${two(i + 1)}</span><span class="p-nm">${esc(it.name)}</span></div>
    ${pStats(it, true)}<div class="bd">${pImg(it)}<div style="min-width:0">${it.point ? `<div class="p-pt"><b>POINT</b>${esc(it.point)}</div>` : ''}${pTags(it, fixed)}</div>${videoLink(it) ? pQR(it) : ''}</div></div>`;
}
function printHTML(p, link) {
  const h = hdrById(p.headerId) || {};
  const days = planDays(p);
  const end = addDays(p.start, days - 1);
  const badge = p.type === 'weekly' ? `曜日別 · ${days}日間` : allDaily(p.items) ? `毎日 · ${days}日間` : `頻度つき · ${days}日間`;
  let body = '';
  if (p.type === 'weekly') {
    normSched(p);
    const colorOf = b => bColor(p.blocks.indexOf(b), S.settings.accent);
    const rows = p.sched.map((day, di) => { const ds = addDays(p.start, di); const bl = day.map(id => p.blocks.find(b => b.id === id)).filter(Boolean);
      return `<tr><td class="d num">${md(ds)}</td><td class="w">${DOW_EN[dow(ds)]}</td><td>${bl.length ? bl.map(b => `<span class="p-bc" style="--bc:${colorOf(b)}"><i>${LETTERS[p.blocks.indexOf(b)]}</i>${esc(b.name)}</span>`).join('') : '<span class="p-rest">REST 休養日</span>'}</td></tr>`; }).join('');
    body = `<table class="p-sched"><thead><tr><th>DATE</th><th>DAY</th><th>MENU メニュー</th></tr></thead><tbody>${rows}</tbody></table>` +
      p.blocks.filter(b => b.items.length).map(b => `<div class="p-bhead" style="--bc:${colorOf(b)}"><i>${LETTERS[p.blocks.indexOf(b)]}</i><b>${esc(b.name)}</b></div><div class="p-grid">${b.items.map((it, i) => pCard(it, i, false)).join('')}</div>`).join('');
  } else {
    const fixed = !allDaily(p.items);
    body = p.items.length <= 3 ? p.items.map((it, i) => pRowLarge(it, i, fixed)).join('') : `<div class="p-grid">${p.items.map((it, i) => pCard(it, i, fixed)).join('')}</div>`;

function viewerDays(d) { if (!isDate(d.start) || !isDate(d.next)) return 1; return Math.max(1, Math.min(31, diffDays(d.start, d.next))); }

  if (!n.ex && !n.tpl && !n.hdr && !n.plan) throw new Error('empty');
  saveNow(); render();
  toast(`読み込みました（種目${n.ex}・テンプレ${n.tpl}・ヘッダー${n.hdr}${n.plan ? `・プラン${n.plan}` : ''}）`);
}

const ACTIONS = {
  'home'() { if (U.view === 'edit') leaveEditorCleanup(); go('home'); },
  'nav'(el) { if (U.view === 'edit') leaveEditorCleanup(); go(el.dataset.v); },
  'accent'(el) { S.settings.accent = el.dataset.k; saveNow(); U.keepScroll = true; render(); },
  'hide-notice'() { S.settings.seedNotice = false; save(); render(); },
  'new-plan'(el) { const p = newPlan(el.dataset.type === 'weekly' ? 'weekly' : 'fixed'); S.plans.push(p); U.sheet = false; U.libTab = 'tpl'; openPlan(p.id); if (window.matchMedia('(max-width: 900px)').matches) { U.sheet = true; render(); } },
  'open-plan'(el) { openPlan(el.dataset.id); },
  'dup-plan'(el) { const src = planById(el.dataset.id); if (!src) return; const p = clone(src); const span = planDays(src); p.id = uid(); p.created = today(); p.start = today(); p.next = addDays(p.start, span); p.updated = Date.now(); p.items.forEach(i => i.uid = uid()); p.blocks.forEach(b => b.items.forEach(i => i.uid = uid())); S.plans.push(p); save(); openPlan(p.id); toast('複製しました。日付を確認してください'); },
  'del-plan'(el) { const p = planById(el.dataset.id); confirmBox(`${p.initials || 'イニシャルなし'}（${dotDate(p.created)}）のプランを削除します。元に戻せません。`, '削除する', () => { S.plans = S.plans.filter(x => x.id !== p.id); saveNow(); render(); toast('削除しました'); }); },
  'lib-tab'(el) { U.libTab = el.dataset.k; U.libCat = 'all'; U.libQ = ''; render(); },
  'lib-cat'(el) { U.libCat = el.dataset.k; render(); },
  'sheet-open'() { U.sheet = true; render(); },
  'sheet-close'() { U.sheet = false; render(); },
  'add-ex'(el) { insertAt(Infinity, el.dataset.id, null); },
  'add-tpl'(el) { insertAt(Infinity, null, el.dataset.id); },
  'rm-item'(el) { const arr = targetItems(); const u = el.closest('[data-uid]').dataset.uid; const i = arr.findIndex(x => x.uid === u); if (i >= 0) arr.splice(i, 1); touchTarget(); render(); },
  'step'(el) { const arr = targetItems(); const it = arr.find(x => x.uid === el.closest('[data-uid]').dataset.uid); const v = parseFloat(it.reps); if (isNaN(v)) return; const step = it.unit === '秒' ? 5 : 1; it.reps = String(Math.max(0, v + step * (+el.dataset.d))); const inp = el.parentElement.querySelector('input'); if (inp) inp.value = it.reps; touchTarget(); },
  'set-type'(el) { const p = curPlan(); const k = el.dataset.k; if (p.type === k) return; const from = p.type;
    if (k === 'weekly' && from !== 'weekly' && p.items.length && !p.blocks.some(b => b.items.length)) { p.blocks[0].items = p.items; p.items = []; normSched(p); p.sched = p.sched.map(() => [p.blocks[0].id]); }
    else if (k !== 'weekly' && from === 'weekly' && !p.items.length) { p.items = p.blocks.flatMap(b => b.items); }
    p.type = k; U.block = 0; touch(p); render(); },
  'sel-block'(el) { U.block = +el.dataset.i; render(); },
  'add-block'() { const p = curPlan(); p.blocks.push({ id: uid(), name: `メニュー${LETTERS[p.blocks.length]}`, items: [] }); U.block = p.blocks.length - 1; touch(p); render(); },
  'del-block'() { const p = curPlan(); const b = p.blocks[U.block]; confirmBox(`ブロック「${b.name}」を削除します（中の${b.items.length}種目も消えます）`, '削除する', () => { p.blocks.splice(U.block, 1); U.block = 0; normSched(p); touch(p); render(); }); },
  'toggle-day'(el) { const p = curPlan(); normSched(p); const day = p.sched[+el.dataset.d]; const id = el.dataset.b; const i = day.indexOf(id); if (i >= 0) day.splice(i, 1); else { day.push(id); day.sort((a, b) => p.blocks.findIndex(x => x.id === a) - p.blocks.findIndex(x => x.id === b)); } touch(p); render(); },
  'repeat-days'() { const p = curPlan(); normSched(p); const n = +($('#rep-n') || {}).value || 2; const pat = p.sched.slice(0, n); p.sched = p.sched.map((_, i) => [...pat[i % n]]); touch(p); render(); toast(`最初の${n}日を繰り返しました`); },
  'clear-days'() { const p = curPlan(); normSched(p); p.sched = p.sched.map(() => []); touch(p); render(); },
  'save-as-tpl'() { const p = curPlan(); const items = p.type === 'weekly' ? p.blocks[U.block].items : p.items; if (!items.length) { toast('種目を入れてから保存してください'); return; }
    openModal(`<h3>SAVE TEMPLATE<small>${p.type === 'weekly' ? `ブロック「${esc(p.blocks[U.block].name)}」の${items.length}種目` : `今の${items.length}種目`}をテンプレートにします</small></h3>
      <label class="flab"><span>NAME テンプレート名</span><input class="field" id="st-name" placeholder="例 足関節捻挫 フェーズ2（競技復帰前）" autofocus></label>
      <label class="flab"><span>GROUP 分類</span><select class="field" id="st-group">${Object.entries(TPL_GROUPS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
      <div class="modal-acts"><button class="btn" data-act="modal-close">キャンセル</button><button class="btn pri" data-act="modal-ok">保存</button></div>`,
      { ok: () => { const name = $('#st-name').value.trim(); if (!name) { $('#st-name').focus(); return; } S.templates.push({ id: uid(), name, group: $('#st-group').value, owner: S.settings.staff || '', items: items.map(i => Object.assign(clone(i), { uid: uid() })) }); saveNow(); closeModal(); toast('テンプレートに保存しました'); render(); } }); },
  'preview'() { const p = curPlan(); if (!hasContent(p)) { toast('種目を1つ以上入れてください'); return; } U.pvDay = null; go('preview'); },
  'back-edit'() { go('edit'); },
  'pv-tab'(el) { U.pvTab = el.dataset.k; render(); },
  'print'() { printPlan(); },
  'copy-link'() { if (U.link) copyText(U.link, 'リンクをコピーしました'); },
  'share-link'() { if (navigator.share && U.link) navigator.share({ title: 'トレーニングメニュー', url: U.link }).catch(() => {}); },
  'vday'(el) { if (V) { V.day = +el.dataset.d; renderViewer(); } else { U.pvDay = +el.dataset.d; const pi = $('#phoneIn'); const p = curPlan(); if (pi && p) pi.innerHTML = viewerHTML(unpack(pack(p)), U.pvDay); applyAccent(); } },
  'ex-cat'(el) { U.exCat = el.dataset.k; render(); },
  'ex-new'() { openExModal(null); },
  'ex-edit'(el) { openExModal(exById(el.dataset.id)); },
  'ex-photo-clear'() { readExForm(); exDraft.photo = ''; const prev = $('#ex-photo-prev'); if (prev) prev.innerHTML = 'なし'; el_hide('[data-act="ex-photo-clear"]'); },
  'ex-save'() { const d = readExForm(); if (!d.name) { toast('種目名を入れてください'); $('#ex-name').focus(); return; }
    if (d.id) { const i = S.exercises.findIndex(e => e.id === d.id); S.exercises[i] = d; } else { d.id = uid(); S.exercises.push(d); }
    saveNow(); closeModal(); render(); toast('保存しました'); },
  'ex-del'() { const d = exDraft; confirmBox(`「${d.name}」をライブラリから削除します。作成済みのプランやテンプレートの中身は残ります。`, '削除する', () => { S.exercises = S.exercises.filter(e => e.id !== d.id); saveNow(); render(); toast('削除しました'); }); },
  'tpl-cat'(el) { U.tplCat = el.dataset.k; render(); },
  'tpl-new'() { const t = { id: uid(), name: '新しいテンプレート', group: 'phase', owner: S.settings.staff || '', items: [] }; S.templates.push(t); save(); U.tplId = t.id; U.libTab = 'ex'; U.libCat = 'all'; go('tpl-edit'); },
  'lib-ex-edit'(el) { openExModal(exById(el.dataset.id)); },
  'lib-tpl-edit'(el) { U.tplReturn = U.planId; U.tplId = el.dataset.id; U.libTab = 'ex'; U.libCat = 'all'; U.libQ = ''; go('tpl-edit'); },
  'tpl-done'() { const r = U.tplReturn; U.tplReturn = null; if (r && planById(r)) { U.planId = r; U.libTab = 'tpl'; U.libCat = 'all'; go('edit'); } else go('templates'); },
  'tpl-edit'(el) { U.tplReturn = null; U.tplId = el.dataset.id; U.libTab = 'ex'; U.libCat = 'all'; go('tpl-edit'); },
  'tpl-dup'(el) { const t = clone(tplById(el.dataset.id)); t.id = uid(); t.name += '（コピー）'; t.owner = S.settings.staff || t.owner; t.items.forEach(i => i.uid = uid()); S.templates.push(t); saveNow(); render(); toast('複製しました'); },
  'tpl-del'(el) { const t = tplById(el.dataset.id); confirmBox(`テンプレート「${t.name}」を削除します。`, '削除する', () => { S.templates = S.templates.filter(x => x.id !== t.id); saveNow(); render(); toast('削除しました'); }); },
  'hdr-add'() { const h = { id: uid(), label: `パターン${S.headers.length + 1}`, org: '[所属名]', logo: '' }; S.headers.push(h); saveNow(); render(); },
  'hdr-del'(el) { const id = el.closest('[data-hid]').dataset.hid; confirmBox('このヘッダーを削除します。', '削除する', () => { S.headers = S.headers.filter(h => h.id !== id); if (S.settings.headerId === id) S.settings.headerId = S.headers[0].id; saveNow(); render(); }); },
  'hdr-default'(el) { S.settings.headerId = el.closest('[data-hid]').dataset.hid; saveNow(); render(); },
  'hdr-logo-clear'(el) { const h = hdrById(el.closest('[data-hid]').dataset.hid); h.logo = ''; saveNow(); render(); },
  'export-share'() { const d = { kind: 'rehab-menu-share', v: 1, exported: today(), by: S.settings.staff, exercises: S.exercises, templates: S.templates, headers: S.headers }; downloadFile(`rehab-menu-library-${today()}.json`, JSON.stringify(d)); },
  'export-all'() { const d = Object.assign({ kind: 'rehab-menu-backup', exported: today() }, S); downloadFile(`rehab-menu-backup-${today()}.json`, JSON.stringify(d)); },
  'import-paste'() { openModal(`<h3>IMPORT<small>書き出した内容を貼り付け</small></h3><textarea class="field" id="imp-text" rows="8" placeholder="{ ... }"></textarea><div class="modal-acts"><button class="btn" data-act="modal-close">キャンセル</button><button class="btn pri" data-act="modal-ok">読み込む</button></div>`, { ok: () => { try { mergeImport(JSON.parse($('#imp-text').value)); closeModal(); } catch (e) { toast('読み込めませんでした。書き出した内容をそのまま貼り付けてください'); } } }); },
  'modal-close'() { closeModal(); },
  'modal-ok'() { modalHandlers.ok && modalHandlers.ok(); },
  'modal-bg'(el, e) { if (e.target === el) closeModal(); },
  'tm-copy'() { const t = $('#tm-text'); t.select(); copyText(t.value); }
};
function el_hide(sel) { const e = $(sel); if (e) e.remove(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = ACTIONS[el.dataset.act]; if (!a) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  if (el.tagName === 'A') return;
  e.preventDefault(); a(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in) { U[el.dataset.in] = el.value; const pos = el.selectionStart; const id = el.id; render(); const n = $('#' + id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } return; }
  if (el.dataset.f && el.type !== 'checkbox' && el.tagName !== 'SELECT') { const arr = targetItems(); const it = arr && arr.find(x => x.uid === el.closest('[data-uid]').dataset.uid); if (it) { it[el.dataset.f] = el.value; touchTarget(); } return; }
  if (el.dataset.pf && el.tagName !== 'SELECT' && el.type !== 'date') { const p = curPlan(); p[el.dataset.pf] = el.value; touch(p); return; }
  if (el.dataset.bf) { const p = curPlan(); p.blocks[U.block][el.dataset.bf] = el.value; touch(p); const tab = $$('.btab .bn')[U.block]; if (tab) tab.firstChild.textContent = el.value; return; }
  if (el.dataset.tf && el.tagName !== 'SELECT') { curTpl()[el.dataset.tf] = el.value; save(); return; }
  if (el.dataset.hf) { const h = hdrById(el.closest('[data-hid]').dataset.hid); h[el.dataset.hf] = el.value; save(); return; }
  if (el.dataset.sf && el.type !== 'checkbox') { S.settings[el.dataset.sf] = el.value; save(); return; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.f && (el.type === 'checkbox' || el.tagName === 'SELECT')) { const arr = targetItems(); const it = arr.find(x => x.uid === el.closest('[data-uid]').dataset.uid); it[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; touchTarget(); if (el.dataset.f === 'unit' || el.dataset.f === 'loadType') render(); return; }
  if (el.dataset.pf && (el.tagName === 'SELECT' || el.type === 'date')) { const p = curPlan(); if (el.type === 'date' && !isDate(el.value)) return; p[el.dataset.pf] = el.value;
    if (el.dataset.pf === 'start' && isDate(p.next) && diffDays(p.start, p.next) < 1) p.next = addDays(p.start, 1);
    touch(p); render(); return; }
  if (el.dataset.tf && el.tagName === 'SELECT') { curTpl()[el.dataset.tf] = el.value; save(); return; }
  if (el.dataset.sf && el.type === 'checkbox') { S.settings[el.dataset.sf] = el.checked; save(); return; }
  if (el.dataset.act === 'tpl-mine') { U.tplMine = el.checked; render(); return; }
  if (el.id === 'ex-photo' && el.files[0]) { try { readExForm(); exDraft.photo = await resizeImage(el.files[0]); const prev = $('#ex-photo-prev'); if (prev) prev.innerHTML = `<img src="${exDraft.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`; } catch (er) { toast('画像を読み込めませんでした'); } return; }
  if (el.dataset.actFile === 'logo' && el.files[0]) { try { const h = hdrById(el.closest('[data-hid]').dataset.hid); h.logo = await resizeImage(el.files[0], 360); saveNow(); render(); } catch (er) { toast('画像を読み込めませんでした'); } return; }
  if (el.dataset.actFile === 'import' && el.files[0]) { try { mergeImport(JSON.parse(await el.files[0].text())); } catch (er) { toast('読み込めませんでした。書き出したファイルを選んでください'); } el.value = ''; return; }
});
document.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') { e.target.classList.add('broken'); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* ================= viewer mode ================= */
let V = null;
function renderViewer() { $('#app').innerHTML = viewerHTML(V.data, V.day); }
async function boot() {
  const h = location.hash;
  if (h.startsWith('#p=')) {
    document.title = 'トレーニングメニュー';
    try { const data = unpack(await decode(h.slice(3))); V = { data, day: null }; V.day = data.type === 'weekly' ? initialDay(data) : null; renderViewer(); }
    catch (e) { $('#app').innerHTML = `<div class="vw gut"><h1 class="disp">LINK<br><span>ERROR</span></h1><p>リンクが途中で切れているか、壊れています。担当者にもう一度送ってもらってください。</p></div>`; }
    return;
  }
  render();
}
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#p=') || V) location.reload(); });
boot();
})();
</script>
